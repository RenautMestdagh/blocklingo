name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHP ${{ matrix.php }}, WordPress ${{ matrix.wp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported combination, and current.
          - php: '7.4'
            wp: '6.6.*'
          - php: '8.3'
            wp: '*'
          - php: '8.4'
            wp: '*'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: db_tests
        ports:
          - 3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, intl
          tools: composer:v2
          coverage: none

      - name: WordPress ${{ matrix.wp }}
        run: |
          composer config platform.php ${{ matrix.php }}
          composer require --dev --no-update "roots/wordpress-full:${{ matrix.wp }}" "wp-phpunit/wp-phpunit:${{ matrix.wp }}"
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      - name: PHPUnit
        run: composer test
        env:
          WP_TESTS_DB_HOST: 127.0.0.1:${{ job.services.mysql.ports[3306] }}
          WP_TESTS_DB_NAME: db_tests
          WP_TESTS_DB_USER: root
          WP_TESTS_DB_PASSWORD: ''
