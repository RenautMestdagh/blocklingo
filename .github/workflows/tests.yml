name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  phpunit:
    # Every supported PHP version against the oldest supported WordPress, the last 6.x and
    # the latest. "Requires at least" and "Requires PHP" in readme.txt must match the
    # oldest versions here.
    name: PHP ${{ matrix.php }} - WP ${{ matrix.wp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: [ '8.5', '8.4', '8.3', '8.2', '8.1', '8.0', '7.4' ]
        wp: [ '*', '6.9.*', '6.6.*' ]
        exclude:
          # WordPress 6.6 predates PHP 8.4.
          - wp: '6.6.*'
            php: '8.5'
          - wp: '6.6.*'
            php: '8.4'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: db_tests
        ports:
          - 3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, intl
          tools: composer:v2
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install WordPress ${{ matrix.wp }} and dependencies
        run: |
          composer config platform.php ${{ matrix.php }}
          composer require --dev "roots/wordpress-full:${{ matrix.wp }}" "wp-phpunit/wp-phpunit:${{ matrix.wp }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: WordPress version under test
        run: php -r 'include "vendor/roots/wordpress-full/wp-includes/version.php"; echo "WordPress $wp_version\n";'

      - name: Execute tests
        run: vendor/bin/phpunit
        env:
          WP_TESTS_DB_HOST: 127.0.0.1:${{ job.services.mysql.ports[3306] }}
          WP_TESTS_DB_NAME: db_tests
          WP_TESTS_DB_USER: root
          WP_TESTS_DB_PASSWORD: ''
